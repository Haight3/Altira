[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "altira"
version = "2026.11.1"
description = 'Image-driven DEM acquisition and elevation queries.'
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = 'Ismail Baris', email = 'ismail.baris@haight.ai' },
]
keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
]
dependencies = [
    "defusedxml>=0.7.1",
    "numpy>=1.26",
    "requests>=2.32",
    "typer>=0.12",
]
[project.urls]
Homepage = "https://github.com/Haight3/altira"
Issues = "https://github.com/Haight3/altira/issues"
Documentation = "https://altira.readthedocs.io/"

[project.scripts]
altira = "altira.cli:app"

[project.optional-dependencies]
dev = [
    "bumpver",
    "matplotlib",
    "pytest>=8.4.2",
    "timm",
    "ruff==0.16.1",
    "sphinx",
    "shibuya",
    "jupyterlab",
    "twine",
    "build",
    "import-linter",
    "pre-commit>=3.7",
    "tqdm",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
]

test = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0",
    "tqdm",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["altira*"]

[tool.importlinter]
root_package = "altira"

[[tool.importlinter.contracts]]
name = "Application modules depend on lower-level modules"
type = "layers"
layers = [
    "altira.cli",
    "altira.dem",
    "altira.image | altira.provider | altira.vertical",
    "altira.datasets",
    "altira.coverage | altira.downloads | altira.raster",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["migrations"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-modules",
    "--doctest-glob=*.rst",
    "--tb=short",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.bumpver]
current_version = "2026.11.1"
version_pattern = "YYYY.MM.PATCH"
commit_message = "ver(altira): bump version from {old_version} -> {new_version}"
commit = true
tag = false
push = true
version_regex = "(?P<year>[0-9]{4})\\.(?P<month>[0-9]{1,2})\\.(?P<patch>[0-9]+)"
version_replacement = "{year}.{month}.{patch}"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"README.md" = [
    "v-{version}",
]
"src/altira/version.py" = [
    '__version__ = "{version}"',
]
"docs/conf.py" = [
    'version = release = "{version}"',
]
"docs/readme.rst" = [
    "Altira [v-{version}]",
]


[tool.ruff]
line-length = 140
extend-exclude = ["resources/docs/conf.py", "resources/scripts/deploy.py"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "any-type",
    "missing-trailing-comma",
    "missing-blank-line-after-summary",
    "multi-line-summary-second-line",
    "missing-trailing-period",
    "non-imperative-mood",
    "missing-blank-line-after-last-section",
    "missing-terminal-punctuation",
    "EM",
    "raw-string-in-exception",
    "commented-out-code",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "too-many-arguments",
    "PTH",
    "write-whole-file", # Repository path convention uses strings and os.path.
    "unnecessary-assign",
    "print",
    "raise-vanilla-args",
    "complex-structure",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "private-member-access",
    "lowercase-imported-as-non-lowercase",
    "too-many-locals",
    "import-private-name",
    "too-many-statements-in-try-clause",
    "camelcase-imported-as-acronym",
    "non-empty-init-module",
]

[tool.ruff.lint.per-file-ignores]
"resources/docs/conf.py" = ["builtin-variable-shadowing", "undocumented-public-module", "implicit-namespace-package", "bad-quotes-inline-string", "utf8-encoding-declaration", "format-literals", "printf-string-formatting", "f-string", "unsorted-imports", "missing-trailing-comma"]
"resources/scripts/*.py" = ["undocumented-public-module", "implicit-namespace-package", "utf8-encoding-declaration"]
"tests/*.py" = ["missing-return-type-undocumented-public-function", "undocumented-public-module", "undocumented-public-function", "implicit-namespace-package", "map-int-version-parsing", "assert", "incorrect-dict-iterator", "unused-loop-control-variable", "magic-value-comparison", "non-lowercase-variable-in-function", "import-outside-top-level", "missing-return-type-private-function"]
"src/**/__init__.py" = ["non-empty-init-module", "unused-import", "missing-copyright-notice", "undefined-local-with-import-star", "undocumented-public-package"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
